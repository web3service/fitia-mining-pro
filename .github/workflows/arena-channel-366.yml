name: Prepare verified Android 3.6.6 channel
on:
  push:
    branches: [arena/b3b7c938-fitia-mining-pro]
    paths: [.github/workflows/arena-channel-366.yml]
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42329495918
          name: FITIA-PRO-Miner-APK
          path: ${{ runner.temp }}/fitia-build
      - name: Verify published asset and prepare update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/fitia-build"
          expected=7b6eed813ab7e8a10a4ad2c05270bbaac01743db4cf6ef2071a53ae7649425cf
          echo "$expected  $artifact/FITIA-PRO-Miner.apk" | sha256sum -c -
          gh api "repos/$GH_REPO/releases/assets/719349531" --jq .digest | grep -Fx "sha256:$expected"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fitia-build' / 'update-current.json'
          m = json.loads(p.read_text())
          assert m['enabled'] and m['versionCode'] == 366 and m['versionName'] == '3.6.6'
          assert m['sha256'] == '7b6eed813ab7e8a10a4ad2c05270bbaac01743db4cf6ef2071a53ae7649425cf'
          assert m['apkUrl'] == 'https://github.com/web3service/fitia-mining-pro/releases/download/v3.6.6/FITIA-PRO-Miner.apk'
          PY
          cp "$artifact/FITIA-PRO-Miner.apk" FITIA-PRO-Miner.apk
          cp "$artifact/update-current.json" update-current.json
          git rm .github/workflows/arena-channel-366.yml .github/workflows/arena-publish-366.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FITIA-PRO-Miner.apk update-current.json
          git commit -m 'Activate verified Android 3.6.6 update channel'
          git push origin HEAD:arena/b3b7c938-fitia-mining-pro

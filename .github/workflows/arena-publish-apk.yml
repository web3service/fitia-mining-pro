name: Publish verified FITIA PRO 3.6.5
on:
  push:
    branches: [arena/705fd20d-fitia-mining-pro]
    paths: [.github/workflows/arena-publish-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously verified signed APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42088486852
          name: FITIA-PRO-Miner-3.6.5
          path: ${{ runner.temp }}/fitia-publish
      - name: Verify digest and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fitia-publish"
          echo '4bd5935c3970c3bcc1a06f690e5f99a0a54ff00edaffe6c54831464171c32319  FITIA-PRO-Miner.apk' | sha256sum -c -
          if output=$(gh release create v3.6.5 FITIA-PRO-Miner.apk --target aa80691384ca60e1223543f2a33c36c3ba37e34f --title 'FITIA PRO 3.6.5' --notes 'Choix du pays avec drapeau à la création du compte et photo de profil locale à votre appareil.' --latest 2>&1); then
            echo "$output"
          else
            echo "::error title=Release publication failed::$output"
            exit 1
          fi

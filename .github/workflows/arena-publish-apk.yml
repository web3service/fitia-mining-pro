name: Publish verified FITIA PRO 3.6.4
on:
  push:
    branches: [arena/ae2c3d79-fitia-mining-pro]
    paths: [.github/workflows/arena-publish-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously verified signed APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42083314054
          name: FITIA-PRO-Miner-3.6.4
          path: ${{ runner.temp }}/fitia-publish
      - name: Verify digest and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fitia-publish"
          echo 'e0d7b3a7f906940cbe0f1348ae328df727ddcc5b4baf0421b09cadb0ed00640c  FITIA-PRO-Miner.apk' | sha256sum -c -
          gh release create v3.6.4 FITIA-PRO-Miner.apk --target 00c5b35 --title 'FITIA PRO 3.6.4' --notes 'Interface Mon compte améliorée, protections du wallet renforcées et améliorations de sécurité.' --latest

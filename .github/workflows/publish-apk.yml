name: Publish signed APK release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (for example v3.3.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the signed APK and update manifest
        uses: actions/checkout@v4

      - name: Verify APK against update.json
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("update.json"))["sha256"])')"
          actual="$(sha256sum FITIA-PRO-Miner.apk | awk '{print $1}')"
          if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]] || [[ "$actual" != "$expected" ]]; then
            echo "APK SHA-256 does not match update.json" >&2
            exit 1
          fi
          echo "Verified APK SHA-256: $actual"

      - name: Attach APK to the existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag }}"
          gh release upload "${{ inputs.tag }}" FITIA-PRO-Miner.apk --clobber

name: Prepare verified Android 3.6.8 channel
on:
  push:
    branches: [arena/c24401d8-fitia-mining-pro]
    paths: [.github/workflows/arena-channel-368.yml]
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42334695845
          name: FITIA-PRO-Miner-APK
          path: ${{ runner.temp }}/fitia-build
      - name: Verify published asset and prepare update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/fitia-build"
          expected=2a427e1d16f7c0ab0aef0c7f3a154a73ab1d8d7eeac3fe0674461a1722774db9
          echo "$expected  $artifact/FITIA-PRO-Miner.apk" | sha256sum -c -
          gh api "repos/$GH_REPO/releases/assets/719490325" --jq .digest | grep -Fx "sha256:$expected"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fitia-build' / 'update-current.json'
          m = json.loads(p.read_text())
          assert m['enabled'] and m['versionCode'] == 368 and m['versionName'] == '3.6.8'
          assert m['sha256'] == '2a427e1d16f7c0ab0aef0c7f3a154a73ab1d8d7eeac3fe0674461a1722774db9'
          assert m['apkUrl'] == 'https://github.com/web3service/fitia-mining-pro/releases/download/v3.6.8/FITIA-PRO-Miner.apk'
          PY
          cp "$artifact/FITIA-PRO-Miner.apk" FITIA-PRO-Miner.apk
          cp "$artifact/update-current.json" update-current.json
          git rm .github/workflows/arena-channel-368.yml .github/workflows/arena-publish-368.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FITIA-PRO-Miner.apk update-current.json
          git commit -m 'Activate verified Android 3.6.8 update channel'
          git push origin HEAD:arena/c24401d8-fitia-mining-pro

name: Temporary live FARM release check

on:
  push:
    branches:
      - arena/3a4ecec3-fitia-mining-pro
    paths:
      - .github/workflows/live-farm-check.yml

permissions:
  contents: read

jobs:
  live-farm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public release and signed FARM API without payment
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const ethers = require('./vendor/ethers.umd.min.js');
          const Protocol = require('./farm-protocol');
          const expected = require('./update-current.json');
          const base = 'https://fitia-mining-pro.vercel.app';
          const hash = (value) => crypto.createHash('sha256').update(value).digest('hex');

          async function response(url, options = {}) {
            return fetch(url, {
              ...options,
              headers: { Accept: 'application/json', ...(options.headers || {}) },
              signal: AbortSignal.timeout(60000),
            });
          }

          (async () => {
            const manifestResponse = await response(`${base}/update-current.json?live_farm=${Date.now()}`, { cache: 'no-store' });
            assert.equal(manifestResponse.status, 200);
            const manifest = await manifestResponse.json();
            assert.equal(manifest.enabled, true);
            assert.equal(manifest.versionCode, 334);
            assert.equal(manifest.versionName, '3.4.0');
            assert.equal(manifest.apkUrl, expected.apkUrl);
            assert.equal(manifest.sha256, expected.sha256);

            const apkResponse = await response(manifest.apkUrl, { headers: { Accept: 'application/octet-stream' } });
            assert.equal(apkResponse.status, 200);
            const apk = Buffer.from(await apkResponse.arrayBuffer());
            const localApk = fs.readFileSync('FITIA-PRO-Miner.apk');
            assert.equal(apk.length, 1910471);
            assert.equal(hash(apk), expected.sha256);
            assert.equal(hash(apk), hash(localApk));
            console.log('PUBLIC_RELEASE_OK version=3.4.0 code=334 hash_match=true');

            const options = await response(`${base}/api/farm`, { method: 'OPTIONS' });
            assert.equal(options.status, 204);
            assert.equal(options.headers.get('access-control-allow-origin'), '*');
            assert.equal(options.headers.get('x-content-type-options'), 'nosniff');

            const method = await response(`${base}/api/farm`);
            assert.equal(method.status, 405);
            assert.equal((await method.json()).code, 'FARM_METHOD');

            const wallet = ethers.Wallet.createRandom();
            async function post(action, params = {}, invalidSignature = false) {
              const body = { action, buyer: wallet.address, timestamp: Date.now(), ...params };
              body.signature = invalidSignature ? `0x${'00'.repeat(65)}` : await wallet.signMessage(Protocol.message(action, body));
              const res = await response(`${base}/api/farm`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
              });
              return { status: res.status, data: await res.json() };
            }

            const rejected = await post('state', {}, true);
            assert.equal(rejected.status, 401);
            assert.equal(rejected.data.code, 'FARM_AUTH');

            const initial = await post('state');
            assert.equal(initial.status, 200, JSON.stringify(initial.data));
            assert.equal(initial.data.revision, 0);
            assert.equal(initial.data.state.coins, 0);
            assert.equal(initial.data.state.land, null);
            assert.deepEqual(initial.data.state.animals, []);
            assert.deepEqual(initial.data.withdrawals, []);

            const purchase = await post('action', {
              actionId: crypto.randomUUID(), type: 'buy_land', params: {},
            });
            assert.equal(purchase.status, 409, JSON.stringify(purchase.data));
            assert.equal(purchase.data.code, 'FARM_INSUFFICIENT_COINS');

            const unchanged = await post('state');
            assert.equal(unchanged.status, 200);
            assert.equal(unchanged.data.revision, 0);
            assert.equal(unchanged.data.state.coins, 0);

            const admin = await response(`${base}/api/admin/farm-withdrawals`);
            assert.equal(admin.status, 401);
            console.log('LIVE_FARM_API_OK signed_state=true invalid_auth_rejected=true no_payment=true no_mutation=true');
            console.log('LIVE_ADMIN_AUTH_OK');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

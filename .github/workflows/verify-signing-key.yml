name: Verify replacement Android signing key

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: Expected public SHA-256 certificate fingerprint
        required: true
        default: fa3494fb50ee2240f477b7cb21bb0d8606cedceac36a263e1e877f34319fdf72
        type: string

permissions:
  contents: read

concurrency:
  group: fitia-signing-key-verification
  cancel-in-progress: false

jobs:
  verify-signing-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LANG: C
      LC_ALL: C
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the stored private key and public certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FITIA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FITIA_ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -Eeuo pipefail

          stage="Initialisation"
          actual_alias="non détecté"
          actual_sha256="non détectée"

          write_summary() {
            local title="$1"
            local message="$2"
            {
              printf '## %s\n\n' "$title"
              printf -- '- Étape : %s\n' "$stage"
              printf -- '- Alias détecté : `%s`\n' "$actual_alias"
              printf -- '- Empreinte SHA-256 détectée : `%s`\n' "$actual_sha256"
              printf '\n%s\n' "$message"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          fail() {
            local message="$1"
            trap - ERR
            write_summary "❌ Échec de la vérification de la clé" "$message"
            printf 'Error: %s\n' "$message" >&2
            exit 1
          }

          unexpected_error() {
            local line="$1"
            fail "Erreur inattendue à la ligne $line du script de vérification."
          }
          trap 'unexpected_error $LINENO' ERR

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            fail "Les deux secrets FITIA_ANDROID_KEYSTORE_BASE64 et FITIA_ANDROID_KEYSTORE_PASSWORD doivent être configurés."
          fi

          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            fail "L’empreinte attendue doit contenir exactement 64 caractères hexadécimaux."
          fi
          expected="${EXPECTED_SHA256,,}"

          stage="Préparation du fichier temporaire"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          keystore="$work_dir/fitia-release.p12"
          keytool_output="$work_dir/keytool-output.txt"

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"; then
            fail "Le secret FITIA_ANDROID_KEYSTORE_BASE64 n’est pas un Base64 valide. Recopiez la ligne complète du fichier Base64."
          fi
          chmod 600 "$keystore"

          if [[ ! -s "$keystore" ]]; then
            fail "Le fichier PKCS12 obtenu après décodage est vide."
          fi

          stage="Ouverture du PKCS12"
          if ! keytool -list \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" > "$keytool_output" 2>&1; then
            fail "Impossible d’ouvrir le fichier PKCS12. Vérifiez le mot de passe du secret FITIA_ANDROID_KEYSTORE_PASSWORD et le contenu du Base64."
          fi

          stage="Lecture de la clé privée"
          entry_count="$(sed -n -E 's/^Your keystore contains ([0-9]+) (entry|entries)$/\1/p' "$keytool_output")"
          if [[ "$entry_count" != "1" ]]; then
            fail "Le PKCS12 doit contenir exactement une clé privée. Nombre d’entrées détecté : ${entry_count:-inconnu}."
          fi

          detected_alias="$(awk -F', ' '/PrivateKeyEntry/{print $1; exit}' "$keytool_output")"
          if [[ -n "$detected_alias" ]]; then
            actual_alias="$detected_alias"
          else
            fail "Aucune entrée de clé privée n’a été trouvée dans le PKCS12."
          fi

          actual_sha256="$(sed -n -E 's/^Certificate fingerprint \(SHA-256\):[[:space:]]*//p' "$keytool_output" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            actual_sha256="non détectée"
            fail "Impossible de lire l’empreinte SHA-256 publique du certificat."
          fi

          stage="Comparaison du certificat"
          if [[ "$actual_sha256" != "$expected" ]]; then
            fail "L’empreinte du certificat ne correspond pas à celle attendue. Comparez les deux empreintes affichées ci-dessus."
          fi

          stage="Test de détection automatique par le compilateur"
          if ! build_alias="$(python3 - "$keystore" 2>&1 <<'PY'
          import contextlib
          import io
          import os
          import shutil
          import sys
          from scripts.build_apk import detect_private_key_alias

          with contextlib.redirect_stdout(io.StringIO()):
              alias = detect_private_key_alias(
                  shutil.which("keytool"),
                  sys.argv[1],
                  os.environ["KEYSTORE_PASSWORD"],
              )
          print(alias)
          PY
          )"; then
            fail "Le compilateur n’a pas réussi à détecter automatiquement l’unique clé privée. Aucun secret n’a été affiché."
          fi

          if [[ "$build_alias" != "$actual_alias" ]]; then
            fail "La détection du compilateur (${build_alias}) ne correspond pas à l’alias du PKCS12 (${actual_alias})."
          fi

          stage="Terminé"
          write_summary "✅ Clé de signature vérifiée" "Le fichier PKCS12, le mot de passe, la clé privée et l’empreinte sont valides. Le compilateur a détecté et utilisé automatiquement l’alias ${actual_alias}. Aucun APK n’a été compilé ou publié."
          printf 'Private key, password, automatic alias detection, and certificate verified.\n'
          printf 'Detected alias: %s\n' "$actual_alias"
          printf 'Certificate SHA-256: %s\n' "$actual_sha256"

name: Prepare signed APK for manual download

on:
  push:
    branches:
      - arena/ae2c3d79-fitia-mining-pro
    paths:
      - .github/workflows/arena-apk-delivery.yml

permissions:
  actions: read
  contents: read

jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the successfully tested signed build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42082793274
          name: FITIA-PRO-Miner-APK
          path: ${{ runner.temp }}/fitia-delivery
      - name: Verify APK checksum and audited sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path.cwd()
          artifact = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fitia-delivery'
          apk = artifact / 'FITIA-PRO-Miner.apk'
          manifest = json.loads((artifact / 'update-current.json').read_text())
          version = json.loads((root / 'package.json').read_text())['version']
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert version == '3.6.4' and manifest['versionName'] == version
          assert manifest['versionCode'] == 364
          assert manifest['sha256'] == digest
          assert manifest['apkUrl'] == f'https://github.com/web3service/fitia-mining-pro/releases/download/v{version}/FITIA-PRO-Miner.apk'
          with zipfile.ZipFile(apk) as archive:
              for source, bundled in [('app.js', 'app.js'), ('account.js', 'account.js'), ('style.css', 'style.css'), ('android-src/wallet.html', 'wallet.html')]:
                  assert archive.read('assets/www/' + bundled) == (root / source).read_bytes(), source
          print(f'::notice title=FITIA APK SHA-256::{digest}')
          print(f'::notice title=FITIA pinned certificate SHA-256::{(root / "android-src/release-certificate-sha256.txt").read_text().strip()}')
          PY
      - name: Upload only the signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FITIA-PRO-Miner-3.6.4
          path: ${{ runner.temp }}/fitia-delivery/FITIA-PRO-Miner.apk
          if-no-files-found: error
          retention-days: 30

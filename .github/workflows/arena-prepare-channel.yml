name: Prepare verified Android update channel
on:
  push:
    branches: [arena/ae2c3d79-fitia-mining-pro]
    paths: [.github/workflows/arena-prepare-channel.yml]
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42082793274
          name: FITIA-PRO-Miner-APK
          path: ${{ runner.temp }}/fitia-build
      - name: Verify published APK and prepare update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/fitia-build"
          expected=e0d7b3a7f906940cbe0f1348ae328df727ddcc5b4baf0421b09cadb0ed00640c
          echo "$expected  $artifact/FITIA-PRO-Miner.apk" | sha256sum -c -
          gh api repos/"$GH_REPO"/releases/assets/714372657 --jq .digest | grep -Fx "sha256:$expected"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fitia-build' / 'update-current.json'
          m = json.loads(p.read_text())
          assert m['enabled'] and m['versionCode'] == 364 and m['versionName'] == '3.6.4'
          assert m['sha256'] == 'e0d7b3a7f906940cbe0f1348ae328df727ddcc5b4baf0421b09cadb0ed00640c'
          assert m['apkUrl'] == 'https://github.com/web3service/fitia-mining-pro/releases/download/v3.6.4/FITIA-PRO-Miner.apk'
          PY
          cp "$artifact/FITIA-PRO-Miner.apk" FITIA-PRO-Miner.apk
          cp "$artifact/update-current.json" update-current.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = 'La version Android 3.6.4 est préparée pour une installation manuelle ; le canal `update-current.json` reste sur 3.6.3 tant que la nouvelle version n’est pas publiée.'
          assert old in text
          p.write_text(text.replace(old, 'La version Android 3.6.4 est publiée avec sa signature officielle ; le canal `update-current.json` référence son APK et son SHA-256.'))
          PY
          git rm .github/workflows/arena-prepare-channel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FITIA-PRO-Miner.apk update-current.json README.md
          git commit -m 'Activate verified Android 3.6.4 update channel'
          git push origin HEAD:arena/ae2c3d79-fitia-mining-pro

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aperçu FITIA FARM</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    html,body{margin:0;min-height:100%;background:#15261c;color:#ecf2e5;font-family:system-ui,sans-serif}
    .preview-shell{max-width:900px;margin:auto;padding:0 12px 30px}
    .preview-banner{position:sticky;top:0;z-index:20;padding:10px 12px;background:#d9ecca;color:#213b26;text-align:center;font-size:12px;line-height:1.4;font-weight:700}
    .preview-banner small{display:block;font-weight:500}.preview-toast{position:fixed;bottom:20px;left:50%;z-index:3000;transform:translateX(-50%);padding:12px 16px;border-radius:10px;background:#d9ecca;color:#213b26;box-shadow:0 6px 25px #0008;display:none}.preview-toast.visible{display:block}
    .pf-back{display:none!important}.pf-page{padding-top:10px!important}
    .preview-guide{margin:12px 0 0;padding:12px;border:1px solid #607b59;border-radius:14px;background:#20392a}.preview-guide summary{cursor:pointer;color:#e9f6df;font-weight:750}.preview-guide p{color:#c0d4bb;font-size:12px;line-height:1.4}.preview-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.preview-links button{min-height:42px;padding:6px;border:1px solid #668960;border-radius:9px;background:#2d4932;color:#eff8e9;font-size:11px;font-weight:700}.preview-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.preview-tools button{flex:1 1 90px;min-height:40px;border:1px solid #87a77a;border-radius:9px;background:#d2e6c7;color:#1f3a24;font-weight:700;font-size:11px}

  </style>
</head>
<body>
  <div class="preview-banner">APERÇU DE DÉVELOPPEMENT · ARGENT FICTIF<small>Wallet de test · conversions et retraits simulés · aucune opération réelle</small></div>
  <div class="preview-shell">
    <details class="preview-guide"><summary>Outils et raccourcis de démonstration</summary>
      <p>Appuie sur un raccourci, ou touche directement la ferme en 3D.</p>
      <div class="preview-links">
        <button type="button" data-preview-action="crops">Parcelles et cultures</button><button type="button" data-preview-action="animals">Animaux</button><button type="button" data-preview-action="market">Marché</button>
        <button type="button" data-preview-action="layout">Aménagement</button><button type="button" data-preview-action="breed">Reproduction</button><button type="button" data-preview-action="fertilize">Engrais</button><button type="button" data-preview-action="care">Soins animaux</button><button type="button" data-preview-action="well">Puits</button><button type="button" data-preview-action="tractor">Tracteur</button><button type="button" data-preview-action="mill">Moulin</button><button type="button" data-preview-action="silo">Silo</button>
        <button type="button" data-preview-action="progress">Missions et niveau</button><button type="button" data-preview-action="deposit">Conversion fictive</button><button type="button" data-preview-action="withdraw">Retrait fictif</button>
      </div>
      <div class="preview-tools"><button type="button" id="preview-ready">Rendre les productions prêtes</button><button type="button" id="preview-reset">Réinitialiser</button><button type="button" id="preview-new-farm">Nouvelle ferme</button></div>
    </details>
    <div id="view-farm" class="view active farm-view"></div>
  </div>
  <div id="modal-farm-dialog" class="modal"><div class="modal-content modal-scrollable farm-modal-content">
    <div class="modal-header"><div><h3 id="farm-dialog-title">FITIA FARM</h3><p id="farm-dialog-subtitle" class="farm-modal-subtitle"></p></div><button class="modal-close" onclick="App.farmCenter.closeDialog()" aria-label="Fermer">✕</button></div>
    <div id="farm-dialog-content" class="farm-dialog-content"></div><p id="farm-dialog-error" class="farm-dialog-error" role="alert"></p><div id="farm-dialog-actions" class="farm-dialog-actions"></div>
  </div></div>
  <div id="preview-toast" class="preview-toast" role="status"></div>
  <script src="/vendor/ethers.umd.min.js"></script><script src="/vendor/three.min.js"></script>
  <script src="/farm-config.js"></script><script src="/farm-protocol.js"></script><script src="/farm-3d.js"></script><script src="/farm.js"></script><script src="/game-experience-farm.js"></script><script src="/preview-client.js"></script>
</body></html>
